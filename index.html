<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Task Manager Pro</h1>
    <p class="subtitle">A simple, no-fuss way to track your tasks</p>
  </header>

  <main class="container">
    <section class="stats-bar" id="statsBar">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statTodo">0</span>
        <span class="stat-label">To Do</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statInProgress">0</span>
        <span class="stat-label">In Progress</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statDone">0</span>
        <span class="stat-label">Done</span>
      </div>
    </section>

    <section class="form-section">
      <h2 id="formTitle">Create Task</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId" />

        <div class="form-row">
          <label for="title">Title *</label>
          <input type="text" id="title" required maxlength="120" placeholder="e.g. Finish quarterly report" />
        </div>

        <div class="form-row">
          <label for="description">Description *</label>
          <textarea id="description" required maxlength="500" placeholder="Details about the task..."></textarea>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>

          <div class="form-row">
            <label for="status">Status</label>
            <select id="status">
              <option value="TODO" selected>To Do</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="DONE">Done</option>
            </select>
          </div>

          <div class="form-row">
            <label for="dueDate">Due Date *</label>
            <input type="date" id="dueDate" required />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Add Task</button>
          <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="controls-section">
      <input type="text" id="searchInput" placeholder="Search tasks by title or description..." />

      <select id="filterStatus">
        <option value="">All Statuses</option>
        <option value="TODO">To Do</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="DONE">Done</option>
      </select>

      <select id="filterPriority">
        <option value="">All Priorities</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>

      <select id="sortBy">
        <option value="created_at">Newest First</option>
        <option value="due_date">Due Date</option>
        <option value="priority">Priority</option>
        <option value="title">Title</option>
      </select>
    </section>

    <section class="task-list-section">
      <div id="loadingIndicator" class="loading hidden">Loading tasks...</div>
      <div id="emptyState" class="empty-state hidden">No tasks found. Create one above to get started.</div>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Delete Task</h3>
      <p>Are you sure you want to delete "<span id="confirmTaskTitle"></span>"? This cannot be undone.</p>
      <div class="modal-actions">
        <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
        <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
